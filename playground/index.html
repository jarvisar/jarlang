<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JarLang Playground - Online Interpreter & x86-64 Compiler</title>
  <meta name="description" content="Write and run JarLang code in your browser. JarLang is a small programming language with an interpreter and a native compiler. See the tokens, syntax tree, types, and x86-64 assembly for any program.">
  <meta name="color-scheme" content="light dark">
  <link rel="canonical" href="https://jarlang.jarvisar.com/">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Link previews. og:image has to be an absolute URL -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="JarLang">
  <meta property="og:title" content="JarLang Playground">
  <meta property="og:description" content="Write and run JarLang code in your browser, and see the syntax tree, types, and x86-64 assembly for any program.">
  <meta property="og:url" content="https://jarlang.jarvisar.com/">
  <meta property="og:image" content="https://jarlang.jarvisar.com/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="JarLang logo with the text: a small programming language with an interpreter and x86-64 compiler">
  <meta name="twitter:card" content="summary_large_image">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "JarLang Playground",
    "url": "https://jarlang.jarvisar.com/",
    "description": "Write and run JarLang code in your browser. JarLang is a small programming language with an interpreter and a native x86-64 compiler.",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "Any",
    "browserRequirements": "Requires JavaScript and WebAssembly",
    "image": "https://jarlang.jarvisar.com/og-image.png",
    "author": { "@type": "Person", "name": "Adam Jarvis", "url": "https://github.com/jarvisar" },
    "sameAs": "https://github.com/jarvisar/jarlang",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
  }
  </script>
  <!-- The worker downloads Python from here once the bundle has loaded -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <script>
    // Apply the saved or system theme before the page is drawn
    (function () {
      var theme = null;
      try { theme = localStorage.getItem("jarlang-playground:theme"); } catch (e) {}
      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/codemirror.min.css" integrity="sha512-uf06llspW44/LZpHzHT6qBOIVODjWtv4MxCricRxkzvopAlSWnTf6hpZTFxuuZcuNE9CBQhqE0Seu1CoRk84nQ==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/addon/lint/lint.min.css" integrity="sha512-jP1+o6s94WQS9boYeDP3Azh8ihI5BxGgBZNjkABhx05MqH5WuDzfzSnoPxGxVzWi/gxxVHZHvWkdRM6SMy5B0Q==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="style.css">
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "JarLang",
      "url": "https://jarlang.jarvisar.com/"
    }
  </script>
  <!-- Cloudflare Web Analytics. Only on the live site, so local dev aren't counted -->
  <script>
    if (location.hostname === 'jarlang.jarvisar.com') {
      const beacon = document.createElement('script');
      beacon.type = 'module';
      beacon.src = 'https://static.cloudflareinsights.com/beacon.min.js';
      beacon.dataset.cfBeacon = '{"token": "a52a84e110ba48c0868dd4ae87e235b7"}';
      document.head.appendChild(beacon);
    }
  </script>
</head>
<body>
  <header class="topbar">
    <h1 class="brand-heading">
      <a class="brand" href="./">
        <img class="logo" src="logo.png" alt="" width="30" height="30">
        <span class="brand-name">JarLang</span>
        <span class="brand-tag">Playground</span>
      </a>
    </h1>
    <span class="version" id="version"></span>

    <div class="toolbar" role="toolbar" aria-label="Playground">
      <button type="button" id="run" class="btn btn-run" title="Run (Ctrl+Enter)" aria-keyshortcuts="Control+Enter Meta+Enter">
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.5v9l7.5-4.5z"/></svg>Run
      </button>
      <button type="button" id="stop" class="btn" title="Stop the program" disabled>
        <svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="2" width="8" height="8"/></svg>Stop
      </button>
      <button type="button" id="format" class="btn" title="Format the code (Shift+Alt+F)" aria-keyshortcuts="Shift+Alt+F">Format</button>
      <button type="button" id="share" class="btn" title="Copy a link to this code">Share</button>
      <select id="examples" class="btn select" aria-label="Load an example">
        <option value="" disabled selected>Examples</option>
      </select>
    </div>

    <nav class="links">
      <a href="https://github.com/jarvisar/jarlang/blob/main/docs/language.md" target="_blank" rel="noopener">Docs</a>
      <a href="https://github.com/jarvisar/jarlang" target="_blank" rel="noopener">GitHub</a>
      <button type="button" id="theme-toggle" class="link-btn">Dark theme</button>
    </nav>
  </header>

  <noscript>
    <div class="noscript">
      <p>The JarLang Playground needs JavaScript to run code. JarLang is a small programming language with an interpreter and a native compiler that generates x86-64 assembly. You can also install it and run it locally.</p>
      <p>See the <a href="https://github.com/jarvisar/jarlang/blob/main/docs/language.md">language docs</a> or the <a href="https://github.com/jarvisar/jarlang">source code on GitHub</a>.</p>
    </div>
  </noscript>

  <main class="workspace" id="workspace">
    <section class="pane editor-pane" aria-label="Editor">
      <div class="pane-head">
        <span class="pane-title">main.jlang</span>
      </div>
      <textarea id="code" aria-label="Code" spellcheck="false"></textarea>
    </section>

    <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" aria-label="Resize" aria-valuemin="20" aria-valuemax="80" aria-valuenow="50" tabindex="0"></div>

    <section class="pane output-pane" aria-label="Results">
      <div class="pane-head">
        <div class="tabs" role="tablist" aria-label="Results">
          <button type="button" role="tab" class="tab" id="tab-output" data-tab="output" aria-controls="panel-output" aria-selected="true">Output</button>
          <button type="button" role="tab" class="tab" id="tab-ast" data-tab="ast" aria-controls="panel-ast" aria-selected="false" tabindex="-1">AST</button>
          <button type="button" role="tab" class="tab" id="tab-tokens" data-tab="tokens" aria-controls="panel-tokens" aria-selected="false" tabindex="-1">Tokens</button>
          <button type="button" role="tab" class="tab" id="tab-asm" data-tab="asm" aria-controls="panel-asm" aria-selected="false" tabindex="-1">x86-64</button>
          <button type="button" role="tab" class="tab" id="tab-types" data-tab="types" aria-controls="panel-types" aria-selected="false" tabindex="-1">Types</button>
        </div>
        <button type="button" id="copy" class="btn btn-small" title="Copy the text in this tab">Copy</button>
      </div>

      <div class="panel" id="panel-output" role="tabpanel" aria-labelledby="tab-output">
        <details class="stdin" id="stdin-box">
          <summary>Input <span class="badge" id="stdin-count"></span></summary>
          <textarea id="stdin" rows="3" spellcheck="false" placeholder="One line for each input() call" aria-label="Input, one line for each input() call"></textarea>
        </details>
        <div class="scroll" id="output" tabindex="0" aria-label="Output">
          <p class="placeholder">Press Run to run the code.</p>
        </div>
      </div>

      <div class="panel" id="panel-ast" role="tabpanel" aria-labelledby="tab-ast" hidden>
        <div class="panel-bar">
          <div class="btn-group" role="group" aria-label="Format">
            <button type="button" class="btn btn-small" data-ast="tree" aria-pressed="true">Tree</button>
            <button type="button" class="btn btn-small" data-ast="json" aria-pressed="false">JSON</button>
          </div>
          <span class="hint">Output of <code>jarlang ast</code></span>
        </div>
        <div class="scroll" id="ast" tabindex="0" aria-label="Syntax tree"></div>
      </div>

      <div class="panel" id="panel-tokens" role="tabpanel" aria-labelledby="tab-tokens" hidden>
        <div class="panel-bar"><span class="hint">Output of <code>jarlang tokens</code>. Click a row to select the token in the editor.</span></div>
        <div class="scroll" id="tokens" tabindex="0" aria-label="Tokens"></div>
      </div>

      <div class="panel" id="panel-asm" role="tabpanel" aria-labelledby="tab-asm" hidden>
        <div class="panel-bar">
          <label class="inline-select">Target
            <select id="asm-target" class="btn btn-small select">
              <option value="linux">Linux</option>
              <option value="windows">Windows</option>
              <option value="macos">macOS</option>
            </select>
          </label>
          <span class="hint">Output of <code>jarlang asm</code></span>
        </div>
        <div class="scroll" id="asm" tabindex="0" aria-label="Assembly code"></div>
      </div>

      <div class="panel" id="panel-types" role="tabpanel" aria-labelledby="tab-types" hidden>
        <div class="panel-bar"><span class="hint">Output of <code>jarlang explain</code>, the types the native compiler worked out</span></div>
        <div class="scroll" id="types" tabindex="0" aria-label="Types"></div>
      </div>
    </section>
  </main>

  <footer class="statusbar">
    <span class="status" id="status" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><span id="status-text">Loading...</span></span>
    <button type="button" class="status-btn" id="problems" title="Go to the first problem"></button>
    <span class="cursor" id="cursor">Ln 1, Col 1</span>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/codemirror.min.js" integrity="sha512-hJEMjfR4ds7mXbBot3i/R+CsiyYpeWSezXul8uLBT8wXAHPUdhRgl4LLTtMGwjarftGKiQqK1v20XScm0ANTPQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/addon/mode/simple.min.js" integrity="sha512-CGM6DWPHs250F/m90YZ9NEiEUhd9a4+u8wAzeKC6uHzZbYyt9/e2dLC5BGGB6Y0HtEdZQdSDYjDsoTyNGdMrMA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/addon/edit/matchbrackets.min.js" integrity="sha512-GSYCbN/le5gNmfAWVEjg1tKnOH7ilK6xCLgA7c48IReoIR2g2vldxTM6kZlN6o3VtWIe6fHu/qhwxIt11J8EBA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/addon/edit/closebrackets.min.js" integrity="sha512-tsjcYO5hFvViRssxiM7Jhd8601epWOx1He3Hl4yuI5dKKPxr43KxkOhc9GZeeqzlYJm9ABb7UPA9697NiqZZ7Q==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/addon/comment/comment.min.js" integrity="sha512-UaJ8Lcadz5cc5mkWmdU8cJr0wMn7d8AZX5A24IqVGUd1MZzPJTq9dLLW6I102iljTcdB39YvVcCgBhM0raGAZQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/addon/lint/lint.min.js" integrity="sha512-pbCRN8TEb9NSIsKf10EkT4ZSfE2QxHjX8q6ajtMR8PQaDKcIGn2fo33U1BjYdXB76dri5dyhSlheQ2XoI/Lbaw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.20/addon/selection/active-line.min.js" integrity="sha512-0sDhEPgX5DsfNcL5ty4kP6tR8H2vPkn40GwA0RYTshkbksURAlsRVnG4ECPPBQh7ZYU6S3rGvp5uhlGQUNrcmA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="app.js"></script>
</body>
</html>
